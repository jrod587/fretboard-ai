<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fretboard AI — Local Song Copilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;font-family:'Outfit',sans-serif;color:#d4c9a8;overflow-x:hidden}
    #root ::-webkit-scrollbar{height:6px;width:6px}
    #root ::-webkit-scrollbar-track{background:#0a0a0a}
    #root ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
    #root *{scrollbar-width:thin;scrollbar-color:#2a2a2a #0a0a0a}

    /* Layout */
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #0a0a0a;
    }
    .workspace-split {
      display: flex;
      flex: 1;
      flex-direction: row;
      min-height: 0;
      border-top: 1px solid #141414;
    }
    .left-panel {
      width: 340px;
      border-right: 1px solid #141414;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #080808;
      flex-shrink: 0;
    }
    .right-panel {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #0c0c0c;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Interactive Chords Grid */
    .chords-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .chord-btn {
      padding: 10px 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      color: #ccc;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chord-btn:hover {
      background: rgba(255,255,255,0.05);
      transform: translateY(-2px);
    }

    /* Chat Panel */
    .chat-container {
      border: 1px solid #1c1c1c;
      background: #090909;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      height: 300px;
      overflow: hidden;
    }
    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-bubble {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      max-width: 85%;
      word-break: break-word;
    }
    .chat-bubble.coach {
      background: rgba(255,255,255,0.03);
      color: #e0dcd0;
      align-self: flex-start;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .chat-bubble.user {
      align-self: flex-end;
      color: #111;
    }
    .chat-bubble.system {
      align-self: center;
      background: rgba(255,255,255,0.02);
      color: #888;
      font-size: 10px;
      font-family: 'Courier New', monospace;
      text-align: center;
      border-radius: 4px;
      padding: 6px 10px;
      border: 1px dashed rgba(255,255,255,0.05);
      max-width: 95%;
    }

    /* Settings Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .modal-box {
      background: rgba(12,10,8,0.98);
      border: 1px solid #c8b87a50;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      position: relative;
    }

    /* Animations */
    @keyframes pulse-accent {
      0% { box-shadow: 0 0 0 0 rgba(200, 184, 122, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(200, 184, 122, 0); }
      100% { box-shadow: 0 0 0 0 rgba(200, 184, 122, 0); }
    }
    .active-pulse {
      animation: pulse-accent 2s infinite;
    }

    /* Mobile responsive layout overrides */
    @media (max-width: 768px) {
      .workspace-split {
        flex-direction: column;
        overflow-y: auto;
      }
      .left-panel {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #141414;
        overflow-y: visible;
        flex-shrink: 0;
      }
      .right-panel {
        width: 100%;
        overflow-y: visible;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>

<!-- React & Babel CDNs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha512-QVs8Lo43F9lSuBykadDb0oSXDL/BbZ588urWVCRwSIoewQv/Ewg1f84mK3U790bZ0FfhFa1YSQUmIhG+pIRKeg==" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha512-6a1107rTlA4gYpgHAqbwLAtxmWipBdJFcq8y5S/aTge3Bp+VAklABm2LO+Kg51vOWR9JMZq1Ovjl5tpluNpTeQ==" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" integrity="sha512-BfcEFQ1SddlO+7JRhcagE5aEc/jc+KUtCsMGjzwkM4WHPgdHmGaYQPmW9snfgfU73cGW7+9sjdk70YErPPVi0w==" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const OPEN = [4, 11, 7, 2, 9, 4];
const SNAMES = ["e", "B", "G", "D", "A", "E"];
const SCALES = {
  "Pentatonic Minor": [0, 3, 5, 7, 10],
  "Pentatonic Major": [0, 2, 4, 7, 9],
  "Blues": [0, 3, 5, 6, 7, 10],
  "Major": [0, 2, 4, 5, 7, 9, 11],
  "Natural Minor": [0, 2, 3, 5, 7, 8, 10],
  "Dorian": [0, 2, 3, 5, 7, 9, 10],
  "Mixolydian": [0, 2, 4, 5, 7, 9, 10]
};
const THEMES = [
  { id: "ebony", name: "Ebony", swatch: "#c8b87a", accent: "#c8b87a", scaleFg: "#c0f0d4", scaleBg: "#0e2016", scaleBorder: "#1e4028", natFg: "#d0a850", natBg: "#1e1508", sharpFg: "#5878b8", sharpBg: "#0e1228" },
  { id: "ocean", name: "Ocean", swatch: "#48b0e0", accent: "#48b0e0", scaleFg: "#a8dcf8", scaleBg: "#071428", scaleBorder: "#183858", natFg: "#7090b8", natBg: "#0a1220", sharpFg: "#405898", sharpBg: "#080e1c" },
  { id: "ember", name: "Ember", swatch: "#e07040", accent: "#e07040", scaleFg: "#f5c890", scaleBg: "#1e0c04", scaleBorder: "#502808", natFg: "#c89060", natBg: "#1c1008", sharpFg: "#906040", sharpBg: "#140e08" },
  { id: "amethyst", name: "Amethyst", swatch: "#b070e0", accent: "#b070e0", scaleFg: "#d8aafc", scaleBg: "#100820", scaleBorder: "#381858", natFg: "#9080c0", natBg: "#100c1c", sharpFg: "#504098", sharpBg: "#0c0818" }
];

const NUM_FRETS = 24, FW = 46, SH = 40;
const DOT = new Set([3, 5, 7, 9, 12, 15, 17, 19, 21, 24]);
const NATURALS = new Set(["A", "B", "C", "D", "E", "F", "G"]);

const noteAt = (si, f) => NOTES[(OPEN[si] + f) % 12];
const noteSet = (root, ivs) => new Set(ivs.map(i => NOTES[(NOTES.indexOf(root) + i) % 12]));
const IV_LABELS = ["R", "b2", "2", "b3", "3", "4", "b5", "5", "b6", "6", "b7", "7"];
const getInterval = (note, root) => IV_LABELS[(NOTES.indexOf(note) - NOTES.indexOf(root) + 12) % 12];

// Pre-loaded high-fidelity featured songs database
const FEATURED_SONGS = [
  {
    title: "12-Bar Blues in G",
    artist: "Royalty-Free Progression",
    key: "G",
    scaleName: "Blues",
    essence: "The foundational framework of rock and blues. This 12-bar cycle moves through the I, IV, and V chords (G7, C7, D7). By utilizing dominant 7th shapes, it creates a crunchy, soulful momentum that is perfect for pentatonic scale workouts.",
    why: "Unlike simple triads, dominant 7th chords include the flat 7th interval (e.g. F in G7, Bb in C7, C in D7). This creates a dissonant 'tritone' tension that pulls naturally into the next chord. Soloing over these changes with the G Blues Scale lets you target chord tones dynamically.",
    tips: [
      "Practice slide entries: slide up a half-step into the major 3rd of the G7 chord (B) or the C7 chord (E). This is the key to that authentic blues flavor.",
      "The 'blue note' is the flat 5th (Db). Use it as a passing tone when moving between the 4th (C) and 5th (D) degrees of the scale.",
      "Use dominant 9th shapes for the V chord (D9) to add a modern, jazzy funk texture to your rhythm playing."
    ],
    chords: [
      {
        name: "G7 (Dominant 7th)",
        notes: [
          { string: 5, fret: 3, label: "T" },
          { string: 3, fret: 3, label: "1" },
          { string: 2, fret: 4, label: "2" },
          { string: 1, fret: 3, label: "1" }
        ]
      },
      {
        name: "C7 (Dominant 7th)",
        notes: [
          { string: 4, fret: 3, label: "1" },
          { string: 3, fret: 5, label: "3" },
          { string: 2, fret: 3, label: "1" },
          { string: 1, fret: 5, label: "4" }
        ]
      },
      {
        name: "D9 (Funk V Chord)",
        notes: [
          { string: 4, fret: 5, label: "2" },
          { string: 3, fret: 4, label: "1" },
          { string: 2, fret: 5, label: "3" },
          { string: 1, fret: 5, label: "4" }
        ]
      }
    ],
    qa: [
      {
        q: "What scale should I use to solo over this progression?",
        a: "The most versatile choice is the G Blues Scale (G, Bb, C, Db, D, F). It works over all three dominant chords. To take it to the next level, mix the G Minor Pentatonic (dark/gritty) with the G Major Pentatonic (bright/country)—switch to Major over the G7 chord, and Minor over the C7 and D7 chords."
      },
      {
        q: "Why are the chords written as 7ths instead of standard major chords?",
        a: "Dominant 7th chords contain both a major 3rd and a flat 7th. The interval between these two notes is a diminished fifth (tritone), which is highly unstable and tense. This tension is the core signature of the blues—it drives the progression forward, wanting to resolve to the next chord."
      }
    ]
  },
  {
    title: "Jazz ii-V-I in C",
    artist: "Standard Progression",
    key: "C",
    scaleName: "Major",
    essence: "The cornerstone of jazz harmony. This progression modulates smoothly from the ii (Dm7) to the V (G7) and resolves home to the I (Cmaj7). It is the perfect tool for practicing voice leading and modal connections across the fretboard.",
    why: "The progression works because of 'guide tones'—the 3rd and 7th degrees of each chord. As the chords change, these guide tones resolve by half-steps or whole-steps, creating a seamless, rolling harmony that guides the ear home to C.",
    tips: [
      "Locate the guide tones. When moving from Dm7 to G7, the 7th of Dm7 (C) falls a half-step to become the 3rd of G7 (B). That single note change defines the chord transition.",
      "Play modal scales: use D Dorian over Dm7, G Mixolydian over G7, and C Major (Ionian) over Cmaj7.",
      "Use 'shell voicings' (playing only root, 3rd, and 7th) to keep your rhythm playing clean and leave space for a soloist."
    ],
    chords: [
      {
        name: "D Minor 7 (ii Chord)",
        notes: [
          { string: 4, fret: 5, label: "2" },
          { string: 3, fret: 7, label: "4" },
          { string: 2, fret: 5, label: "1" },
          { string: 1, fret: 6, label: "3" }
        ]
      },
      {
        name: "G7 (V Chord)",
        notes: [
          { string: 5, fret: 3, label: "T" },
          { string: 3, fret: 3, label: "1" },
          { string: 2, fret: 4, label: "2" },
          { string: 1, fret: 3, label: "1" }
        ]
      },
      {
        name: "C Major 7 (I Chord)",
        notes: [
          { string: 4, fret: 3, label: "1" },
          { string: 3, fret: 5, label: "3" },
          { string: 2, fret: 4, label: "2" },
          { string: 1, fret: 5, label: "4" }
        ]
      }
    ],
    qa: [
      {
        q: "What are 'guide tones' and how do I target them?",
        a: "Guide tones are the 3rd and 7th intervals of a chord. They define whether a chord is major, minor, or dominant. In a ii-V-I progression, target these notes on the downbeat of chord changes. For example, play the note B (3rd of G7) right when the chord switches from Dm7—it sounds incredibly melodic because it resolves the previous C note by a half-step."
      },
      {
        q: "How does D Dorian differ from C Major if they have the same notes?",
        a: "D Dorian and C Major share the exact same seven notes, but they have different 'gravitational centers'. In D Dorian, the root note is D. The minor 3rd (F) and natural 6th (B) give Dorian its distinct hopeful-minor character. Shifting the center from D to C shifts the key resolution entirely."
      }
    ]
  },
  {
    title: "House of the Rising Sun",
    artist: "Traditional Folk Ballad",
    key: "A",
    scaleName: "Natural Minor",
    essence: "A traditional folk masterpiece in 6/8 time. The progression rotates through Am, C, D, F, then resolves back to Am, E, and Am. It is a masterclass in minor-key voice leading and classical-style fingerstyle arpeggios.",
    why: "The song moves from A natural minor (with a flat 7th, G) into the major V chord (E major, which uses a sharp 7th, G#). This G# note acts as the 'leading tone', pulling the harmony strongly back home to the A minor root.",
    tips: [
      "Hold down the full chord shapes and arpeggiate every string from low to high and back, letting all the notes ring out together.",
      "The transition from D major to F major is tricky—use your pinky to fret the C string or target the common root shifts to make it smooth.",
      "Pay attention to the 6/8 swing. Count 1-2-3-4-5-6, accenting beats 1 and 4."
    ],
    chords: [
      {
        name: "A Minor",
        notes: [
          { string: 4, fret: 0, label: "O" },
          { string: 3, fret: 2, label: "2" },
          { string: 2, fret: 2, label: "3" },
          { string: 1, fret: 1, label: "1" }
        ]
      },
      {
        name: "C Major",
        notes: [
          { string: 4, fret: 3, label: "3" },
          { string: 3, fret: 2, label: "2" },
          { string: 2, fret: 0, label: "O" },
          { string: 1, fret: 1, label: "1" }
        ]
      },
      {
        name: "D Major",
        notes: [
          { string: 3, fret: 0, label: "O" },
          { string: 2, fret: 2, label: "1" },
          { string: 1, fret: 3, label: "3" },
          { string: 0, fret: 2, label: "2" }
        ]
      },
      {
        name: "F Major (Mini Shape)",
        notes: [
          { string: 3, fret: 3, label: "3" },
          { string: 2, fret: 2, label: "2" },
          { string: 1, fret: 1, label: "1" },
          { string: 0, fret: 1, label: "1" }
        ]
      },
      {
        name: "E Major (V Chord)",
        notes: [
          { string: 5, fret: 0, label: "O" },
          { string: 4, fret: 2, label: "2" },
          { string: 3, fret: 2, label: "3" },
          { string: 2, fret: 1, label: "1" }
        ]
      }
    ],
    qa: [
      {
        q: "Why does the E major chord sound so tense compared to the minor chords?",
        a: "The E major chord is the major V chord in the key of A minor. It contains the note G#, which is the 'leading tone' of the key. G# is not in the natural A minor scale (which has G natural), so it sounds surprising and tense, pulling your ear strongly upward by a half-step to resolve to the A root."
      },
      {
        q: "How do I play the arpeggios smoothly?",
        a: "Anchor your right-hand thumb on the bass strings, and use your index (G string), middle (B string), and ring (e string) fingers to pluck the higher strings. Try not to lift your fretting hand fingers until you absolutely must change to the next chord shape."
      }
    ]
  }
];

function LocalCopilotApp() {
  const [tab, setTab] = useState("copilot");
  const [root, setRoot] = useState("G");
  const [scale, setSc] = useState("Blues");
  const [names, setNm] = useState(true);
  const [noteView, setNV] = useState(null);
  const [themeIdx, setTheme] = useState(0);
  const [showIv, setIv] = useState(false);
  
  // Custom Song / Local API Key States
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("GEMINI_API_KEY") || "");
  const [showSettings, setShowSettings] = useState(false);
  const [activeChord, setActiveChord] = useState(null);
  const [selectedSong, setSelectedSong] = useState(FEATURED_SONGS[0]);
  const [customSongs, setCustomSongs] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem("COPILED_SONGS")) || [];
    } catch {
      return [];
    }
  });

  const [searchQuery, setSearchQuery] = useState("");
  const [searching, setSearching] = useState(false);
  const [searchLoadingText, setSearchLoadingText] = useState("");
  const [searchError, setSearchError] = useState("");
  
  const [chatHistory, setChatHistory] = useState([
    { sender: "coach", text: "Hey! I'm your local Song Copilot. Select a featured song, or type a song in the deconstruct bar on the left. Once you've entered your Gemini API Key in the settings (gear icon), I can deconstruct ANY song you type!" }
  ]);
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);

  const t = THEMES[themeIdx];
  const ivs = scale ? (SCALES[scale] || []) : [];
  const sNotes = noteSet(root, ivs);

  // Sync song settings to fretboard key/scale
  useEffect(() => {
    if (selectedSong) {
      setRoot(selectedSong.key);
      setSc(selectedSong.scaleName);
      setActiveChord(null);
    }
  }, [selectedSong]);

  // Save customs
  useEffect(() => {
    localStorage.setItem("COPILED_SONGS", JSON.stringify(customSongs));
  }, [customSongs]);

  // Fretboard highlights
  function getDotStyle(si, fret) {
    const note = noteAt(si, fret), inSc = sNotes.has(note), isRoot = note === root;
    const label = showIv ? getInterval(note, root) : note;
    let bg = "transparent", fg = "transparent", ring = "none", size = 24, shape = "circle";

    if (tab === "copilot" && activeChord) {
      const chordNote = activeChord.notes.find(n => n.string === si && n.fret === fret);
      if (chordNote) {
        const interval = getInterval(note, root);
        const dispLabel = showIv ? interval : chordNote.label;
        return {
          bg: t.accent,
          fg: "#111",
          ring: `2px solid #fff`,
          size: 26,
          shape: "circle",
          label: dispLabel
        };
      }
      if (inSc) {
        return {
          bg: "transparent",
          fg: t.scaleFg + "30",
          ring: `1.5px dashed ${t.scaleBorder}44`,
          size: 22,
          shape: "circle",
          label: showIv ? getInterval(note, root) : note
        };
      }
      return { bg, fg, ring, size, shape, label: "" };
    }

    if (noteView === "bare") return { bg, fg, ring, size, shape, label };
    if (noteView && (tab === "scale" || tab === "copilot")) {
      const isNat = NATURALS.has(note), show = noteView === "all" || (noteView === "natural" && isNat);
      if (show) {
        if (isRoot) { bg = t.accent; fg = "#111"; size = 26; }
        else if (isNat) { bg = t.natBg; fg = t.natFg; ring = `1px solid ${t.natFg}60`; size = 24; }
        else { bg = t.sharpBg; fg = t.sharpFg; ring = `1px solid ${t.sharpFg}50`; size = 22; }
      }
      return { bg, fg, ring, size, shape, label };
    }
    if (tab === "scale" || tab === "copilot") {
      if (isRoot) { bg = t.accent; fg = "#111"; size = 24; }
      else if (inSc) { bg = t.scaleBg; fg = t.scaleFg; ring = `1px solid ${t.scaleBorder}`; }
      else if (names) { fg = "#252525"; }
    }
    return { bg, fg, ring, size, shape, label };
  }

  // Deconstruct a song using Gemini API
  async function deconstructSong(query) {
    if (!apiKey.trim()) {
      setSearchError("Please configure your Gemini API Key in the settings (gear icon) to deconstruct custom songs.");
      return;
    }

    setSearching(true);
    setSearchError("");
    setSearchLoadingText("Connecting to Gemini...");

    const cycleTexts = [
      "Contacting Google model...",
      "Analyzing song key and scale...",
      "Extracting chord fingerings...",
      "Fretting Mayer-style thumb positions...",
      "Resolving CAGED fretboard intervals...",
      "Finalizing structured deconstruction..."
    ];
    let cycleIdx = 0;
    const interval = setInterval(() => {
      if (cycleIdx < cycleTexts.length) {
        setSearchLoadingText(cycleTexts[cycleIdx++]);
      }
    }, 1500);

    try {
      const cleanQuery = query.replace(/[^\w\s-]/g, "");
      const systemPrompt = `You are a professional music theorist and guitar coach. Analyze the song: "${cleanQuery}".
You must output a single JSON object. Ensure all strings (0 to 5) and frets (0 to 24) are strictly integers and physically correct for guitar standard tuning (E A D G B e).

Fretboard index requirements:
- "string": index 5 is Low E (lowest pitch), 4 is A, 3 is D, 2 is G, 1 is B, 0 is High e (highest pitch).
- "fret": 0 for open, 1 to 24 for fret positions.
- "label": single character fingering (T for thumb, 1 for index, 2 for middle, 3 for ring, 4 for pinky).
- Provide 3-5 main chords that define the song's progression or hook.
- "scaleName" must be one of: "Pentatonic Minor", "Pentatonic Major", "Blues", "Major", "Natural Minor", "Dorian", "Mixolydian".
- "key" must be one of: "C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B".
`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Analyze this song: ${cleanQuery}` }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                title: { type: "STRING" },
                artist: { type: "STRING" },
                key: { type: "STRING" },
                scaleName: { type: "STRING" },
                essence: { type: "STRING" },
                why: { type: "STRING" },
                tips: { type: "ARRAY", items: { type: "STRING" } },
                chords: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      name: { type: "STRING" },
                      notes: {
                        type: "ARRAY",
                        items: {
                          type: "OBJECT",
                          properties: {
                            string: { type: "INTEGER" },
                            fret: { type: "INTEGER" },
                            label: { type: "STRING" }
                          },
                          required: ["string", "fret", "label"]
                        }
                      }
                    },
                    required: ["name", "notes"]
                  }
                },
                qa: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      q: { type: "STRING" },
                      a: { type: "STRING" }
                    },
                    required: ["q", "a"]
                  }
                }
              },
              required: ["title", "artist", "key", "scaleName", "essence", "why", "tips", "chords", "qa"]
            }
          }
        })
      });

      clearInterval(interval);
      if (!response.ok) {
        throw new Error(`Gemini API Error: Status ${response.status}`);
      }

      const result = await response.json();
      const parsedText = result.candidates[0].content.parts[0].text;
      const songData = JSON.parse(parsedText);

      // Save custom song
      const updatedCustoms = [songData, ...customSongs.filter(s => s.title !== songData.title)];
      setCustomSongs(updatedCustoms);
      setSelectedSong(songData);
      setSearchQuery("");
      setChatHistory([
        { sender: "coach", text: `I've successfully deconstructed "${songData.title}" by ${songData.artist}! The fretboard has been mapped. Ask me anything about this track!` }
      ]);

    } catch (err) {
      clearInterval(interval);
      console.error(err);
      setSearchError(`Failed to deconstruct song. Make sure your API Key is valid and try again. Error: ${err.message}`);
    } finally {
      setSearching(false);
    }
  }

  // Ask a custom question to Gemini
  async function askCoachQuestion(questionText) {
    if (!questionText.trim()) return;
    setChatInput("");
    
    const updatedHistory = [...chatHistory, { sender: "user", text: questionText }];
    setChatHistory(updatedHistory);
    scrollChat();

    if (!apiKey.trim()) {
      setTimeout(() => {
        setChatHistory([...updatedHistory, { sender: "system", text: "Configure your Gemini API Key in the settings (gear icon) to ask custom questions." }]);
        scrollChat();
      }, 600);
      return;
    }

    setChatLoading(true);
    try {
      const chordsStr = selectedSong.chords.map(c => `${c.name} (string/fret notes: ${JSON.stringify(c.notes)})`).join(", ");
      const chatContextPrompt = `You are Fretboard AI, an expert guitar teacher helping a student play and understand the song: "${selectedSong.title}" by ${selectedSong.artist}.
The song is in the key of ${selectedSong.key} ${selectedSong.scaleName}.
The core essence is: ${selectedSong.essence}.
The theoretical background is: ${selectedSong.why}.
The key chords are: ${chordsStr}.
Answer the student's question accurately, focusing on practical fretboard execution, physical mechanics, and music theory context. Keep the answer concise (under 4-5 sentences) and clear.`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [
            { role: "user", parts: [{ text: `Student asks: ${questionText}` }] }
          ],
          systemInstruction: { parts: [{ text: chatContextPrompt }] }
        })
      });

      if (!response.ok) throw new Error(`Status ${response.status}`);
      
      const result = await response.json();
      const answer = result.candidates[0].content.parts[0].text;
      
      setChatHistory([...updatedHistory, { sender: "coach", text: answer }]);
      scrollChat();
    } catch (err) {
      console.error(err);
      setChatHistory([...updatedHistory, { sender: "system", text: `Chat connection failed: ${err.message}` }]);
      scrollChat();
    } finally {
      setChatLoading(false);
    }
  }

                <div>
                  <div style={{ fontSize: "10px", color: "#888", letterSpacing: 2, fontWeight: 700, marginBottom: 6, fontFamily: "'Courier New', monospace" }}>THE THEORY ("THE WHY")</div>
                  <p style={{ fontSize: "13px", color: "#bbb", lineHeight: 1.6, fontFamily: "system-ui,-apple-system,sans-serif" }}>
                    {selectedSong.why}
                  </p>
                </div>

                {/* Interactive Chord Overlays */}
                <div>
                  <div style={{ fontSize: "10px", color: "#888", letterSpacing: 2, fontWeight: 700, marginBottom: 2, fontFamily: "'Courier New', monospace" }}>INTERACTIVE CHORDS (Click to highlight on fretboard)</div>
                  <div className="chords-grid">
                    {selectedSong.chords.map(chord => (
                      <button 
                        key={chord.name}
                        onClick={() => {
                          if (activeChord?.name === chord.name) {
                            setActiveChord(null);
                          } else {
                            setActiveChord(chord);
                          }
                        }}
                        style={{
                          border: activeChord?.name === chord.name ? `1px solid ${t.accent}` : "1px solid rgba(255,255,255,0.06)",
                          background: activeChord?.name === chord.name ? `${t.accent}12` : "rgba(255,255,255,0.02)",
                          boxShadow: activeChord?.name === chord.name ? `0 0 10px ${t.accent}11` : "none"
                        }}
                        className="chord-btn"
                      >
                        <span style={{ color: activeChord?.name === chord.name ? t.accent : "#ccc" }}>{chord.name}</span>
                        <span style={{ fontSize: "9px", fontWeight: 400, color: "#666" }}>
                          {activeChord?.name === chord.name ? "✓ Overlay Active" : "Click to view"}
                        </span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Technique Checklist */}
                <div>
                  <div style={{ fontSize: "10px", color: "#888", letterSpacing: 2, fontWeight: 700, marginBottom: 8, fontFamily: "'Courier New', monospace" }}>COACH TECHNIQUE CHECKLIST</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {selectedSong.tips.map((tip, i) => (
                      <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start", background: "rgba(255,255,255,0.01)", padding: "10px 12px", borderRadius: 6, border: "1px solid #161616" }}>
                        <span style={{ color: t.accent, fontWeight: 700, fontFamily: "'Courier New', monospace" }}>0{i+1}.</span>
                        <span style={{ fontSize: "12px", color: "#aaa", lineHeight: 1.5, fontFamily: "system-ui,-apple-system,sans-serif" }}>{tip}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* AI Copilot Chat */}
                <div>
                  <div style={{ display: "flex", justifySelf: "space-between", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                    <span style={{ fontSize: "10px", color: "#888", letterSpacing: 2, fontWeight: 700, fontFamily: "'Courier New', monospace" }}>INTERACTIVE DECONSTRUCTION CHAT</span>
                    <span style={{ fontSize: "9px", color: "#666", fontFamily: "system-ui,-apple-system,sans-serif" }}>Powered by Fretboard AI (Local API)</span>
                  </div>
                  <div className="chat-container">
                    <div className="chat-messages" id="copilot-chat-box">
                      {chatHistory.map((msg, idx) => (
                        <div 
                          key={idx} 
                          className={`chat-bubble ${msg.sender}`}
                          style={{
                            background: msg.sender === "user" ? t.accent : undefined
                          }}
                        >
                          {msg.text}
                        </div>
                      ))}
                      {chatLoading && (
                        <div className="chat-bubble coach" style={{ fontStyle: "italic", opacity: 0.6 }}>
                          Coach is thinking...
                        </div>
                      )}
                    </div>
                    
                    {/* Quick Questions */}
                    <div style={{ borderTop: "1px solid #161616", padding: "8px 12px", background: "#080808", display: "flex", gap: 6, overflowX: "auto", flexShrink: 0 }}>
                      {(selectedSong.qa || []).map((qa, i) => (
                        <button 
                          key={i}
                          onClick={() => handleQuickQuestion(qa.q, qa.a)}
                          style={{
                            padding: "4px 10px",
                            background: "transparent",
                            border: "1px solid #333",
                            borderRadius: 20,
                            color: "#999",
                            fontSize: "10px",
                            cursor: "pointer",
                            whiteSpace: "nowrap",
                            fontFamily: "system-ui,-apple-system,sans-serif"
                          }}
                        >
                          {qa.q}
                        </button>
                      ))}
                    </div>

                    {/* Chat Input */}
                    <div style={{ borderTop: "1px solid #1c1c1c", padding: 6, display: "flex", gap: 6, alignItems: "center", background: "#060606", flexShrink: 0 }}>
                      <input 
                        type="text"
                        value={chatInput}
                        onChange={(e) => setChatInput(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === "Enter" && chatInput.trim()) {
                            askCoachQuestion(chatInput.trim());
                          }
                        }}
                        placeholder={apiKey.trim() ? `Ask about ${selectedSong.title} scales, chords or solos...` : "⚠️ Key required to ask custom questions"}
                        disabled={!apiKey.trim() || chatLoading}
                        style={{
                          flex: 1,
                          background: "#0d0d0d",
                          border: "1px solid #2a2a2a",
                          borderRadius: 4,
                          color: "#bbb",
                          padding: "6px 12px",
                          fontSize: "12px",
                          fontFamily: "system-ui,-apple-system,sans-serif",
                          outline: "none"
                        }}
                      />
                      <button 
                        onClick={() => chatInput.trim() && askCoachQuestion(chatInput.trim())}
                        disabled={!apiKey.trim() || chatLoading}
                        style={{
                          padding: "6px 14px",
                          background: "transparent",
                          border: `1px solid ${t.accent}66`,
                          borderRadius: 4,
                          color: t.accent,
                          fontSize: "10px",
                          cursor: "pointer",
                          fontWeight: 700,
                          fontFamily: "'Courier New', monospace"
                        }}
                      >
                        SEND
                      </button>
                    </div>
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LocalCopilotApp />);
</script>
</body>
</html>
